name: Compile C Source

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Syntax check am_map.c
        working-directory: Safety-C Remediation/linuxdoom-1.10
        run: |
          gcc -fsyntax-only -Wall -Wextra -DNORMALUNIX -DLINUX am_map.c
