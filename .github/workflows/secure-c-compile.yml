name: Secure-C Compile

on:
  push:
    branches:
      - "**"
    paths:
      - "Secure-C Remediation/linuxdoom-1.10/**"
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Syntax check changed C files
        run: |
          git diff --name-only HEAD^ HEAD | \
          grep '^Secure-C Remediation/linuxdoom-1.10/.*\.c$' | \
          while read file; do
            echo "Checking $file"
            gcc -fsyntax-only -Wall -Wextra -DNORMALUNIX -DLINUX "$file"
          done
